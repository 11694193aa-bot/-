.cards-area{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.5rem;min-height:200px;align-items:flex-start}
.card-slot{display:flex;flex-direction:column;align-items:center;gap:.6rem;flex:1;min-width:120px;max-width:160px}
.card-label{font-size:.72rem;letter-spacing:.15em;color:#6a5f80;font-family:sans-serif;text-align:center}

.card-back-pattern{width:100%;height:100%;position:absolute;opacity:.18;background-image:repeating-linear-gradient(45deg,#d4af7a 0,#d4af7a 1px,transparent 0,transparent 50%);background-size:10px 10px}
.card-back-symbol{font-size:2.2rem;position:relative;z-index:1;opacity:.6}
.card-face{background:linear-gradient(160deg,#1e1035,#2a1a40);border:1px solid rgba(212,175,122,.35);transform:rotateY(180deg)}
.card-face.reversed .card-symbol{transform:rotate(180deg)}
.card-symbol{font-size:2.8rem;line-height:1}
.card-name{font-size:.7rem;letter-spacing:.1em;color:#d4af7a;text-align:center;line-height:1.3}
.card-rev{font-size:.62rem;color:#8a5f80;font-family:sans-serif;letter-spacing:.1em}
.loading-dots{display:inline-flex;gap:4px;align-items:center}
.loading-dots span{width:4px;height:4px;border-radius:50%;background:#d4af7a;animation:dot .9s infinite}
.loading-dots span:nth-child(2){animation-delay:.15s}
.loading-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.reading-section{background:rgba(255,255,255,.03);border:1px solid rgba(212,175,122,.12);border-radius:14px;padding:1.5rem;animation:fadeUp .6s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.reading-title{font-size:.72rem;letter-spacing:.2em;color:#6a5f80;font-family:sans-serif;margin-bottom:1.2rem;text-align:center}
.reading-cards{display:flex;flex-direction:column;gap:1.2rem}

.reading-summary-text{font-size:.9rem;line-height:1.75;color:#c8c0e0;font-family:sans-serif}
.orb{position:fixed;pointer-events:none;border-radius:50%;filter:blur(80px);opacity:.07;z-index:0}
.reset-btn{display:block;margin:1.5rem auto 0;background:none;border:1px solid rgba(212,175,122,.2);border-radius:20px;color:#6a5f80;font-family:sans-serif;font-size:.75rem;letter-spacing:.12em;padding:.4rem 1.2rem;cursor:pointer;transition:all .2s}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function getReading(card, position, question){
  const q = question.trim();
  const isRev = card.reversed;
  const base = isRev ? (REVERSED[card.name]||UPRIGHT[card.name]) : (UPRIGHT[card.name]||'');
  let posText = '';
  if(position==='过去') posText='在过去的能量影响下，';
  else if(position==='现在') posText='此刻的处境显示，';
  else if(position==='未来') posText='未来的走向指引，';
  else if(position==='阻碍') posText='需要克服的挑战是，';
  else if(position==='建议') posText='塔罗的建议是，';
  else if(position==='结果') posText='最终的走向显示，';
  else if(position==='根源') posText='事情的根源在于，';
  return posText + base;
}

  const hasPositive = cards.some(c=>!c.reversed);
  const hasNegative = cards.some(c=>c.reversed);
  if(hasPositive && !hasNegative) s += '整体能量呈正向流动，宇宙正在支持你前进的方向，保持信心，以开放之心迎接即将到来的改变。';
  else if(!hasPositive && hasNegative) s += '能量显示当下存在一些内在阻碍需要审视，这是一个向内探索、整合阴影的重要时机，转化即将开始。';
  else s += '正逆位并存，显示当下处于转化的过渡期，既有已建立的基础，也有需要调整的面向，平衡与觉察是关键。';
  return s;
}

document.getElementById('draw-btn').addEventListener('click',()=>{
  if(isDrawn) return;
  const question = document.getElementById('question-input').value;
  const spread = SPREADS[currentSpread];
  const shuffled = shuffle(CARDS);
  drawnCards = spread.map((s,i)=>({
    ...shuffled[i],
    reversed: Math.random()<0.35,
    position: s.label
  }));
  
  const area = document.getElementById('cards-area');
  area.innerHTML='';
  drawnCards.forEach((card,i)=>{
    const slot = document.createElement('div');
    slot.className='card-slot';
    const label = document.createElement('div');
    label.className='card-label';
    label.textContent=spread[i].label.toUpperCase();
    const wrap = document.createElement('div');
    wrap.className='card-wrap';
    wrap.innerHTML=`<div class="card-inner">
      <div class="card-back"><div class="card-back-pattern"></div><div class="card-back-symbol">✦</div></div>
      <div class="card-face${card.reversed?' reversed':''}">
        <div class="card-symbol">${card.sym}</div>
        <div class="card-name">${card.num} · ${card.name}</div>
        <div class="card-rev">${card.reversed?'逆位':'正位'}</div>
      </div>
    </div>`;
    slot.appendChild(label);
    slot.appendChild(wrap);
    area.appendChild(slot);
    
    setTimeout(()=>{
      wrap.classList.add('flipped');
      if(i===drawnCards.length-1){
        setTimeout(()=>showReading(question),500);
      }
    },400+i*600);
  });
  
  isDrawn=true;
  document.getElementById('draw-btn').style.opacity='0.3';
  document.getElementById('draw-btn').style.cursor='default';
});

function showReading(question){
  const area = document.getElementById('reading-area');
  area.innerHTML='';
  const sec = document.createElement('div');
  sec.className='reading-section';
  
  let html=`<div class="reading-title">✦ &nbsp; 牌义解读 &nbsp; ✦</div><div class="reading-cards">`;
  drawnCards.forEach(card=>{
    const text = getReading(card, card.position, question);
    html+=`<div class="reading-card">
      <div class="reading-card-header">
        <span class="reading-card-pos">${card.position}</span>
        <span class="reading-card-name">${card.name}</span>
        <span class="reading-card-rev">${card.reversed?'逆位':'正位'}</span>
      </div>
      <div class="reading-card-text">${text}</div>
    </div>`;
  });
  html+=`</div>`;
  
  const summary = buildSummary(drawnCards, question);
  html+=`<div class="reading-summary">
    <div class="reading-summary-label">✦ &nbsp; 综合解读 &nbsp; ✦</div>
    <div class="reading-summary-text">${summary}</div>
  </div>`;
  
  sec.innerHTML=html;
  
  const resetBtn = document.createElement('button');
  resetBtn.className='reset-btn';
  resetBtn.textContent='✦ 重新占卜';
  resetBtn.addEventListener('click', reset);
  
  area.appendChild(sec);
  area.appendChild(resetBtn);
}

function reset(){
  isDrawn=false;
  document.getElementById('cards-area').innerHTML='';
  document.getElementById('reading-area').innerHTML='';
  document.getElementById('draw-btn').style.opacity='1';
  document.getElementById('draw-btn').style.cursor='pointer';
  document.getElementById('question-input').value='';
}
</script>
