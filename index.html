    .draw-btn:active{transform:translateY(0)}
    .action-group{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem}
    .action-btn{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,122,.15);border-radius:50px;color:#d4af7a;font-family:'Georgia',serif;font-size:.9rem;letter-spacing:.12em;padding:.8rem 1.6rem;cursor:pointer;transition:all .3s;box-shadow:0 0 16px rgba(212,175,122,.06)}
    .action-btn:hover{background:rgba(212,175,122,.12);border-color:rgba(212,175,122,.4)}
    .cards-area{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.5rem;min-height:200px;align-items:flex-start}
    .card-slot{display:flex;flex-direction:column;align-items:center;gap:.6rem;flex:1;min-width:120px;max-width:160px}
    .card-label{font-size:.72rem;letter-spacing:.15em;color:#6a5f80;font-family:sans-serif;text-align:center}
    .card-wrap{width:100%;aspect-ratio:2/3;perspective:800px;cursor:pointer}
    .card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1)}
    .card-wrap.flipped .card-inner{transform:rotateY(180deg)}
    .card-face,.card-back{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.5rem;padding:.5rem}
    .card-back{background:linear-gradient(135deg,#1a0f2e,#2a1545);border:1px solid rgba(212,175,122,.25);overflow:hidden}
    .card-back-pattern{width:100%;height:100%;position:absolute;opacity:.18;background-image:repeating-linear-gradient(45deg,#d4af7a 0,#d4af7a 1px,transparent 0,transparent 50%);background-size:10px 10px}
    .card-back-symbol{font-size:2.2rem;position:relative;z-index:1;opacity:.6}
    .card-face{background:linear-gradient(160deg,#1e1035,#2a1a40);border:1px solid rgba(212,175,122,.35);transform:rotateY(180deg)}
    .card-face.reversed .card-symbol{transform:rotate(180deg)}
    .card-symbol{font-size:2.8rem;line-height:1}
    .card-name{font-size:.7rem;letter-spacing:.1em;color:#d4af7a;text-align:center;line-height:1.3}
    .card-rev{font-size:.62rem;color:#8a5f80;font-family:sans-serif;letter-spacing:.1em}
    .loading-dots{display:inline-flex;gap:4px;align-items:center}
    .loading-dots span{width:4px;height:4px;border-radius:50%;background:#d4af7a;animation:dot .9s infinite}
    .loading-dots span:nth-child(2){animation-delay:.15s}
    .loading-dots span:nth-child(3){animation-delay:.3s}
    @keyframes dot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
    .reading-section{background:rgba(255,255,255,.03);border:1px solid rgba(212,175,122,.12);border-radius:14px;padding:1.5rem;animation:fadeUp .6s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .reading-title{font-size:.72rem;letter-spacing:.2em;color:#6a5f80;font-family:sans-serif;margin-bottom:1.2rem;text-align:center}
    .reading-cards{display:flex;flex-direction:column;gap:1.2rem}
    .reading-card{border-left:2px solid rgba(212,175,122,.3);padding-left:1rem}
    .reading-card-header{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.4rem;flex-wrap:wrap}
    .reading-card-pos{font-size:.72rem;letter-spacing:.12em;color:#6a5f80;font-family:sans-serif}
    .reading-card-name{font-size:.95rem;color:#d4af7a;font-weight:400}
    .reading-card-rev{font-size:.7rem;color:#8a5f80;font-family:sans-serif}
    .reading-card-text{font-size:.88rem;line-height:1.75;color:#b0a8c8;font-family:sans-serif}
    .reading-summary{margin-top:1.4rem;padding-top:1.2rem;border-top:1px solid rgba(212,175,122,.1)}
    .reading-summary-label{font-size:.72rem;letter-spacing:.2em;color:#6a5f80;font-family:sans-serif;margin-bottom:.5rem}
    .reading-summary-text{font-size:.9rem;line-height:1.75;color:#c8c0e0;font-family:sans-serif}
    .reading-info{margin-top:.9rem;font-size:.82rem;color:#8a7fa0;font-family:sans-serif}
    .reset-btn{display:block;margin:1.5rem auto 0;background:none;border:1px solid rgba(212,175,122,.2);border-radius:20px;color:#6a5f80;font-family:sans-serif;font-size:.75rem;letter-spacing:.12em;padding:.4rem 1.2rem;cursor:pointer;transition:all .2s}
    .reset-btn:hover{border-color:rgba(212,175,122,.4);color:#a09080}
    .history-item{border:1px solid rgba(212,175,122,.12);border-radius:12px;padding:1rem;background:rgba(255,255,255,.02)}
    .history-item p{font-size:.84rem;line-height:1.6;color:#c8c0e0}
    .history-item strong{color:#d4af7a}

    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      .subtitle { font-size: .75rem; margin-bottom: 1.8rem; }
      .cards-area { gap: .6rem; }
      .card-slot { min-width: 90px; max-width: 110px; }
      .spread-select { gap: .4rem; }
      .spread-btn { font-size: .72rem; padding: .4rem .8rem; }
      .action-group { flex-direction: column; align-items: stretch; padding: 0 .5rem; }
      .action-btn { text-align: center; padding: .9rem 1rem; font-size: .85rem; }
      .draw-btn { width: 90%; font-size: .95rem; }
      .reading-card-text, .reading-summary-text { font-size: .92rem; line-height: 1.85; }
      .api-key-row input { font-size: .85rem; }
      .cards-area.spread-5 { display: grid; grid-template-columns: repeat(3, 1fr); }
      .cards-area.spread-5 .card-slot:nth-child(1) { grid-column: 1; }
      .cards-area.spread-5 .card-slot:nth-child(2) { grid-column: 2; }
      .cards-area.spread-5 .card-slot:nth-child(3),
      .cards-area.spread-5 .card-slot:nth-child(4),
      .cards-area.spread-5 .card-slot:nth-child(5) { grid-column: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card-inner { transition: transform .3s ease; }
      .reading-section { animation: none; }
    }
  </style>
</head>

      '倒吊人':'拖延与牺牲毫无意义，检视是否陷入受害者心态，是时候采取行动打破僵局。',
      '死神':'抗拒必要的改变，执着于已经消逝的事物，放手才能获得真正的自由与新生。',
      '节制':'失衡与过度，某个领域的极端正在带来问题，寻找节制与中庸之道是当务之急。',
      '恶魔':'开始意识到束缚的存在，解脱之路正在打开，勇敢面对阴影，内在自由触手可及。',
      '塔':'担忧灾难或抗拒内在的改变，无法避免的转变终将到来，不如主动面对而非被动承受。',
      '星星':'失去希望或对未来感到迷茫，重新与内在的光联结，宇宙的支持从未消失，只是需要重新感知。',
      '月亮':'混乱与幻觉的迷雾开始消散，潜藏的恐惧浮现需要被整合，清明正在逐渐恢复。',
      '太阳':'短暂的阴云遮蔽了阳光，过度乐观或自我放大带来盲点，保持真实与谦逊，光明终将重现。',
      '审判':'自我批判过重或拒绝成长，放下对过去的执念，以宽容的心接受自己的旅程与选择。',
      '世界':'感到停滞或未竟事宜需要完成，找出阻碍圆满的根源，整合尚未解决的部分，完成才能前进。',
      '权杖王牌':'创意受阻或能量分散，重新点燃热情之火，小心不要在起步阶段就放弃了热情。',
      '圣杯王牌':'情感受阻或自我封闭，允许情感自然流动，不要压抑内心真实的感受与需要。',
      '宝剑王牌':'思维混乱或言语伤人，在说话前三思，以真理服人而非以言语伤害，清明需要时间。',
      '星币王牌':'物质机会被错失或过于保守，审视对金钱与安全感的执念，稳健地把握眼前的机会。',
      '权杖三':'拖延或无法实现愿景，检视是否在计划上过度停留，行动的时候到了。',
      '圣杯七':'幻觉破灭或面对现实，清除不切实际的期待，把握真实可行的选择。',
      '宝剑六':'逃避困境或旅程受阻，面对需要处理的问题，真正的平静来自解决而非逃避。',
      '星币十':'家庭矛盾或物质上的不安全感，审视对繁荣的定义，真正的丰盛源于内在的满足。',
    };
    const SPREADS = {
      1:[{label:'当下启示',pos:'center'}],
      3:[{label:'过去',pos:'left'},{label:'现在',pos:'center'},{label:'未来',pos:'right'}],
      7:[{label:'第一张',pos:'左'}, {label:'第二张',pos:'中'}, {label:'第三张',pos:'右'}],
      5:[{label:'根源',pos:'left'},{label:'阻碍',pos:'center-left'},{label:'现状',pos:'center'},{label:'建议',pos:'center-right'},{label:'结果',pos:'right'}]
    };

    const KEY_STORAGE = 'tarot_ds_key';
    const apiKeyInput = document.getElementById('api-key-input');
    const apiKeyStatus = document.getElementById('api-key-status');
    const savedKey = localStorage.getItem(KEY_STORAGE) || '';
    if (savedKey) {
      apiKeyInput.value = savedKey;
      apiKeyStatus.textContent = '✦ 已载入保存的 Key，AI 解读已启用';
      apiKeyStatus.style.color = '#7a9f7a';
    }

    // ====== History API：阻止右滑退出浏览器，改为回到主界面 ======
    let handlingPopstate = false;

    window.addEventListener('load', () => {
      history.replaceState({ view: 'setup' }, '');
    });

    window.addEventListener('popstate', (e) => {
      if (handlingPopstate) return;
      handlingPopstate = true;
      // e.state 为之前压入的状态（返回到的目标）
      if (e.state && e.state.view === 'setup') {
        if (isDrawn) reset();
      }
      // e.state 为 null → 已回到根页面，交给浏览器默认处理（退出）
      setTimeout(() => { handlingPopstate = false; }, 0);
    });

    document.getElementById('api-key-save').addEventListener('click', () => {
      const k = apiKeyInput.value.trim();
      if (k) {
        localStorage.setItem(KEY_STORAGE, k);
        apiKeyStatus.textContent = '✦ Key 已保存到本地，AI 解读已启用';
        apiKeyStatus.style.color = '#7a9f7a';
      } else {
        localStorage.removeItem(KEY_STORAGE);
        apiKeyStatus.textContent = '✦ Key 已清除，将使用本地解读';
        apiKeyStatus.style.color = '#8a7fa0';
      }
    });

    let currentSpread=3, drawnCards=[], isDrawn=false;

    document.querySelectorAll('.spread-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.spread-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentSpread=parseInt(btn.dataset.spread,10);
        if(isDrawn) reset();
      });
    });

    document.getElementById('draw-btn').addEventListener('click',()=>{
      if(isDrawn) {
        alert('已抽牌，请先重新占卜');
        return;
      }
      const question = document.getElementById('question-input').value;
      const spread = SPREADS[currentSpread];
      const shuffled = shuffle(CARDS);
      drawnCards = spread.map((s,i)=>({
        ...shuffled[i],
        reversed: Math.random()<0.35,
        position: s.label
      }));

      const area = document.getElementById('cards-area');
      area.className = 'cards-area' + (currentSpread === 5 ? ' spread-5' : '');
      area.innerHTML='';
      drawnCards.forEach((card,i)=>{
        const slot = document.createElement('div');
        slot.className='card-slot';
        const label = document.createElement('div');
        label.className='card-label';
        label.textContent=spread[i].label.toUpperCase();
        const wrap = document.createElement('div');
        wrap.className='card-wrap';
        wrap.innerHTML=`<div class="card-inner">
          <div class="card-back"><div class="card-back-pattern"></div><div class="card-back-symbol">✦</div></div>
          <div class="card-face${card.reversed?' reversed':''}">
            <div class="card-symbol">${card.sym}</div>
            <div class="card-name">${card.num} · ${card.name}</div>
            <div class="card-rev">${card.reversed?'逆位':'正位'}</div>
          </div>
        </div>`;
        slot.appendChild(label);
        slot.appendChild(wrap);
        area.appendChild(slot);

        setTimeout(()=>{
          wrap.classList.add('flipped');
          if(i===drawnCards.length-1){
            setTimeout(()=>showReading(question),500);
          }
        },400+i*500);
      });

      isDrawn=true;
      history.pushState({ view: 'reading' }, '');
      const drawBtn = document.getElementById('draw-btn');
      drawBtn.style.opacity='0.3';
      drawBtn.style.cursor='default';
    });

    document.getElementById('history-btn').addEventListener('click', showHistory);

    function shuffle(arr){
      const a=[...arr];
      for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    }

    function getReading(card, position){
      const isRev = card.reversed;
      const base = isRev ? (REVERSED[card.name]||UPRIGHT[card.name]) : (UPRIGHT[card.name]||'');
      let posText = '';
      if(position==='过去') posText='在过去的能量影响下，';
      else if(position==='现在') posText='此刻的处境显示，';
      else if(position==='未来') posText='未来的走向指引，';
      else if(position==='阻碍') posText='需要克服的挑战是，';
      else if(position==='建议') posText='塔罗的建议是，';
      else if(position==='结果') posText='最终的走向显示，';
      else if(position==='根源') posText='事情的根源在于，';
      else if(position==='第一张') posText='第一张卡展示的核心能量是，';
      else if(position==='第二张') posText='第二张卡表达的当前状态是，';
      else if(position==='第三张') posText='第三张卡透露的未来趋势是，';
      return posText + base;
    }

    function buildSummary(cards, question){
      const names = cards.map(c=>c.name).join('、');
      const q = question.trim();
      let s = `本次抽到了${names}，`;
      if(q) s += `针对你所问的"${q}"，`;
      const hasPositive = cards.some(c=>!c.reversed);
      const hasNegative = cards.some(c=>c.reversed);
      if(hasPositive && !hasNegative) s += '整体能量呈正向流动，宇宙正在支持你前进的方向，保持信心，以开放之心迎接即将到来的改变。';
      else if(!hasPositive && hasNegative) s += '能量显示当下存在一些内在阻碍需要审视，这是一个向内探索、整合阴影的重要时机，转化即将开始。';
      else s += '正逆位并存，显示当下处于转化的过渡期，既有已建立的基础，也有需要调整的面向，平衡与觉察是关键。';
      return s;
    }

    function showReading(question){
      const area = document.getElementById('reading-area');
      area.innerHTML='';
      const sec = document.createElement('div');
      sec.className='reading-section';

      let html=`<div class="reading-title">✦ &nbsp; 牌义解读 &nbsp; ✦</div><div class="reading-cards">`;
      drawnCards.forEach(card=>{
        const text = getReading(card, card.position);
        html += `<div class="reading-card">
          <div class="reading-card-header">
            <span class="reading-card-pos">${card.position}</span>
            <span class="reading-card-name">${card.name}</span>
            <span class="reading-card-rev">${card.reversed?'逆位':'正位'}</span>
          </div>
          <div class="reading-card-text">${text}</div>
        </div>`;
      });
      html += `</div>`;

      const summary = buildSummary(drawnCards, question);
      html += `<div class="reading-summary">
        <div class="reading-summary-label">✦ &nbsp; 综合解读 &nbsp; ✦</div>
        <div class="reading-summary-text">${summary}</div>
      </div>`;
      sec.innerHTML = html;

      const saveBtn = document.createElement('button');
      saveBtn.className = 'action-btn';
      saveBtn.textContent = '✦ 保存此次占卜';
      saveBtn.addEventListener('click', ()=>saveRecord(question, summary, saveBtn));

      const resetBtn = document.createElement('button');
      resetBtn.className = 'reset-btn';
      resetBtn.textContent = '✦ 重新占卜';
      resetBtn.addEventListener('click', () => history.back());

      area.appendChild(sec);
      area.appendChild(saveBtn);
      area.appendChild(resetBtn);
    }

    async function saveRecord(question, summary, button){
      if(button.disabled) return;
      button.disabled = true;
      button.textContent = '✦ AI解牌中...';
      const apiKey = apiKeyInput.value.trim() || localStorage.getItem(KEY_STORAGE) || '';
      const payload = {
        question: question.trim(),
        cards: drawnCards.map(({name,reversed,position})=>({name,reversed,position})),
        summary,
        createdAt: Date.now(),
        apiKey
      };
      try {
        const res = await fetch('/api/tarot/save', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });
        if(!res.ok) throw new Error('保存失败');
        const data = await res.json();
        if(data.aiSummary) {
          const textEl = document.querySelector('.reading-summary-text');
          if(textEl){
            textEl.textContent = data.aiSummary;
            if(!document.querySelector('.reading-info')){
              const note = document.createElement('div');
              note.className = 'reading-info';
              note.textContent = '✦ DeepSeek AI 个性化解读';
              textEl.parentNode.appendChild(note);
            }
          }
          button.textContent = '✦ AI解牌完成';
        } else {
          button.textContent = '✦ 已保存（使用本地解读）';
        }
      } catch (error) {
        button.textContent = '保存失败，点击重试';
        button.disabled = false;
        console.error(error);
        alert('保存占卜记录时出现问题，请稍后再试。');
      }
    }

    async function showHistory(){
      const area = document.getElementById('reading-area');
      area.innerHTML='';
      const sec = document.createElement('div');
      sec.className='reading-section';
      sec.innerHTML = `<div class="reading-title">✦ &nbsp; 占卜历史记录 &nbsp; ✦</div><div class="reading-cards"><div class="reading-card-text">正在加载历史记录...</div></div>`;
      area.appendChild(sec);
      try {
        const res = await fetch('/api/tarot/list');
        if(!res.ok) throw new Error('加载失败');
        const records = await res.json();
        if(!Array.isArray(records) || !records.length){
          sec.innerHTML = `<div class="reading-title">✦ &nbsp; 占卜历史记录 &nbsp; ✦</div><div class="reading-card-text">暂时没有保存记录，完成一次占卜后即可保存。</div>`;
          return;
        }
        const listHtml = records.map(record => {
          const date = new Date(record.createdAt).toLocaleString('zh-CN', {hour12:false});
          const cardNames = record.cards.map(c=>`${c.position}：${c.name}${c.reversed?'（逆位）':''}`).join('；');
          return `<div class="history-item"><p><strong>时间：</strong>${date}</p><p><strong>问题：</strong>${record.question || '无问题'}</p><p><strong>牌阵：</strong>${cardNames}</p></div>`;
        }).join('');
        sec.innerHTML = `<div class="reading-title">✦ &nbsp; 占卜历史记录 &nbsp; ✦</div><div class="reading-cards">${listHtml}</div>`;
      } catch (error){
        sec.innerHTML = `<div class="reading-title">✦ &nbsp; 占卜历史记录 &nbsp; ✦</div><div class="reading-card-text">历史记录加载失败，请检查网络后重试。</div>`;
        console.error(error);
      }
    }

    function reset(){
      isDrawn=false;
      document.getElementById('cards-area').innerHTML='';
      document.getElementById('reading-area').innerHTML='';
      const drawBtn = document.getElementById('draw-btn');
      drawBtn.style.opacity='1';
      drawBtn.style.cursor='pointer';
      document.getElementById('question-input').value='';
    }

    // ====== PWA 安装：监听 beforeinstallprompt ======
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // 显示安装横幅
      const banner = document.getElementById('install-banner');
      if (banner) banner.style.display = 'block';
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      const banner = document.getElementById('install-banner');
      if (banner) banner.style.display = 'none';
    });

    // 点击安装横幅触发安装
    window.installPWA = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      const banner = document.getElementById('install-banner');
      if (banner) banner.style.display = 'none';
    };

    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>{
        navigator.serviceWorker.register('/sw.js').catch(()=>{});
      });
    }
  </script>
</body>
</html>
